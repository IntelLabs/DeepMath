[project]
name = "deep-math"
version = "1.0.0"
description = "Library for training and evaluating Math agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    {name = "Daniel Fleischer", email = "daniel.fleischer@intel.com"},
]
keywords = ["machine learning", "reinforcement learning", "mathematical reasoning", "AI agents", "GRPO", "NLP"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "accelerate==1.6.0",
  "datasets==5.0.1",
  "huggingface-hub==1.31.0",
  "hydra-core==1.3.7",
  "math-verify==0.7.0",
  "mistral-common==1.11.6",
  "omegaconf==2.3.0",
  "openai==2.25.0",
  "peft==0.15.2",
  "regex==2025.10.22",
  "smolagents==1.26.0",
  "sympy==1.14.0",
  "submitit",
  "tiktoken==0.12.0",
  "torch==2.10.0",
  "transformers==5.10.4",
  "trl==0.17.0",
  "requests==2.34.2",
  "pip>=26.2.2",
]

[project.urls]
Homepage = "https://github.com/intellabs/DeepMath"
Repository = "https://github.com/intellabs/DeepMath"
Issues = "https://github.com/intellabs/DeepMath/issues"
Documentation = "https://github.com/intellabs/DeepMath#readme"

[project.optional-dependencies]
# The pinned FlashAttention wheel targets Linux x86-64 and Python 3.12.
gpu = [
  "bitsandbytes>=0.45.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "deepspeed==0.16.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "fastapi",
  "flash-attn==2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pydantic",
  "torch==2.10.0",
  "torchaudio==2.10.0",
  "torchvision==0.25.0",
  "uvicorn",
  "vllm==0.19.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu13torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
  "hydra-submitit-launcher>=1.2.0",
  "ipykernel",
  "ipython",
  "pre-commit>=4.2.0",
]

[tool.setuptools]
package-dir = { "" = "deep_math" }
